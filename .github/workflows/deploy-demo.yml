name: Deploy Challenge 3 Demo to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'Challenge 3/challenge3-demo/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: 'Challenge 3/challenge3-demo/package-lock.json'

      - name: Install dependencies
        working-directory: 'Challenge 3/challenge3-demo'
        run: npm ci

      - name: Build
        working-directory: 'Challenge 3/challenge3-demo'
        run: npm run build
        env:
          DEPLOY_TARGET: gh-pages

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'Challenge 3/challenge3-demo/dist'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
